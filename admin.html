<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Travel Guru | Secure Admin</title><link rel="stylesheet" href="style.css"><style>
body{background:#f4f5f2;color:#151917;font-family:Arial,sans-serif}.admin-wrap{max-width:1180px;margin:0 auto;padding:36px 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}.admin-head a{color:#087b3d;font-weight:bold;text-decoration:none}.panel{background:white;border:1px solid #e0e5e0;border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 8px 30px #1323190a}.login{max-width:440px;margin:8vh auto}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{padding:13px;border:1px solid #ccd4ce;border-radius:8px;font:inherit}.btnx{border:0;border-radius:8px;background:#08a94f;color:#fff;font-weight:bold;padding:13px 18px;cursor:pointer}.btnx.secondary{background:#151917}.hidden{display:none!important}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tabs button{padding:10px 14px;border:1px solid #ccd4ce;background:#fff;border-radius:8px;cursor:pointer}.tabs button.active{background:#151917;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8ece8;font-size:14px;vertical-align:top}th{background:#f5f7f5}.status{padding:6px;border:1px solid #ccd4ce;border-radius:6px}.muted{color:#68706b}.error{color:#a3221b}.notice{margin-top:12px;font-weight:bold}
</style></head><body><main class="admin-wrap"><div class="admin-head"><a href="index.html">← Public website</a><strong>TRAVEL GURU · ADMIN</strong></div>
<section id="loginPanel" class="panel login"><h1>Admin sign in</h1><p class="muted">This area is for authorised Travel Guru staff only.</p><form id="loginForm" method="post" action="javascript:void(0)"><label class="field">Admin email<input type="email" name="email" autocomplete="username" required></label><label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btnx" type="submit">Sign in securely</button><p id="loginMessage" class="notice" role="status" aria-live="polite"></p><noscript><p class="notice error">JavaScript must be enabled to sign in.</p></noscript></form></section>
<section id="dashboard" class="hidden"><div class="admin-head"><div><h1>Enquiries & bookings</h1><p class="muted">Customer records are stored in your Supabase project and protected by database access policies.</p></div><button id="logout" class="btnx secondary">Sign out</button></div><div class="tabs"><button class="active" data-kind="inquiries">Enquiries</button><button data-kind="bookings">Booking requests</button></div><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 id="tableTitle">Customer enquiries</h2><button id="refresh" class="btnx">Refresh</button></div><p id="tableMessage" class="muted" role="status"></p><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></section></main>
<script type="module" src="admin.js"></script></body></html>
